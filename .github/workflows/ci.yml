name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      # Pinned to SHA for supply-chain integrity. Bump via Dependabot or
      # by replacing the SHA + comment together — never one without the other.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: node token-meter.mjs --help
      - run: node token-meter.mjs --agents
      - run: npm pack --dry-run
